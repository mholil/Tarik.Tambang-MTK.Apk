name: Publish Debug APK Release

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'apk-distribution/app-debug.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate APK and Checksum
        run: |
          set -e
          echo "Validating APK file existence..."
          if [ ! -f "apk-distribution/app-debug.apk" ]; then
            echo "Error: apk-distribution/app-debug.apk does not exist!"
            exit 1
          fi

          if [ ! -s "apk-distribution/app-debug.apk" ]; then
            echo "Error: apk-distribution/app-debug.apk is empty!"
            exit 1
          fi

          if [ ! -f "apk-distribution/app-debug.apk.sha256" ]; then
            echo "Error: apk-distribution/app-debug.apk.sha256 does not exist!"
            exit 1
          fi

          echo "Verifying SHA-256 checksum..."
          cd apk-distribution
          sha256sum -c app-debug.apk.sha256
          cd ..

          echo "Verifying ZIP archive integrity..."
          unzip -tq apk-distribution/app-debug.apk
          echo "APK validation successful."

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          
          echo "Creating GitHub Release with tag: $TAG_NAME"
          gh release create "$TAG_NAME" \
            apk-distribution/app-debug.apk \
            --title "$RELEASE_TITLE" \
            --notes "Automated release of pre-compiled Android debug APK." \
            --latest

          APK_SIZE=$(du -h apk-distribution/app-debug.apk | cut -f1)
          SHA256_HASH=$(sha256sum apk-distribution/app-debug.apk | cut -d' ' -f1)
          REPO_URL="https://github.com/${{ github.repository }}"
          LATEST_DOWNLOAD_URL="$REPO_URL/releases/latest/download/app-debug.apk"

          echo "### 🚀 APK Release Published Successfully" >> $GITHUB_STEP_SUMMARY
          echo "**Release Tag:** \`$TAG_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "**APK Size:** $APK_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "**SHA-256 Checksum:** \`$SHA256_HASH\`" >> $GITHUB_STEP_SUMMARY
          echo "**Release Page:** [$REPO_URL/releases/latest]($REPO_URL/releases/latest)" >> $GITHUB_STEP_SUMMARY
          echo "**Direct Download URL:** [$LATEST_DOWNLOAD_URL]($LATEST_DOWNLOAD_URL)" >> $GITHUB_STEP_SUMMARY
